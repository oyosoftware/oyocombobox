<!DOCTYPE html>
<html>
	<head>
		<title>Test Combo Box</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
		<script src="oyocombobox.js"></script>
		<style>
            ::-webkit-scrollbar {
                width               : 10px;
                height              : 10px;
            }
            ::-webkit-scrollbar-corner {
                background-color    : transparent;
            }
            ::-webkit-scrollbar-thumb {
                border              : 2px solid black;
                border-radius       : 5px;
            }
            ::-webkit-scrollbar-thumb {
                background-color    : white;
            }
            body {
                white-space: nowrap;
            }
		</style>
	</head>
	<body>

		<script>
            $(document).ready(function () {
                $(document.body).innerHeight(2000);
				var comboBox1 = new oyoComboBox(260, 306.5); // 286
				comboBox1.changePlaceHolder("Select Country");
				$(comboBox1).css("display", "inline-block");
				$(comboBox1).css("margin", "10px");
				$(comboBox1).css("vertical-align", "top");
				$(comboBox1).css("font-size", "20px");
				$("body").append(comboBox1);

				var flag = document.createElement("img");
				$(flag).outerWidth("50");
				$(flag).css("margin", "2px");
				$(flag).css("margin-right", "10px");
                $(flag).css("border", "1px solid black");

				$(flag).attr("src", "flags/au.svg");
				comboBox1.addOption("Australia", flag);
				$(flag).attr("src", "flags/be.svg");
				comboBox1.addOption("Belgium", flag);
				$(flag).attr("src", "flags/ca.svg");
				comboBox1.addOption("Canada", flag);
				$(flag).attr("src", "flags/de.svg");
				comboBox1.addOption("Germany", flag);
				$(flag).attr("src", "flags/ie.svg");
				comboBox1.addOption("Ireland", flag);
				$(flag).attr("src", "flags/nl.svg");
				comboBox1.addOption("Netherlands", flag);
				$(flag).attr("src", "flags/us.svg");
				comboBox1.addOption("U.S.A.", flag);
				$(flag).attr("src", "flags/gb.svg");
				comboBox1.addOption("United Kingdom", flag);
				comboBox1.setValue("Netherlands", true);

				var comboBox2 = new oyoComboBox("auto", "auto");
				comboBox2.changePlaceHolder("Select Country");
                comboBox2.dropdown = true;
				comboBox2.changeColors("#B3CEB3", "#527FC3", "white");
				$(comboBox2).css("display", "inline-block");
				$(comboBox2).css("margin", "10px");
				$(comboBox2).css("vertical-align", "top");
				$(comboBox2).css("font-weight", "bold");
				$(comboBox2).css("font-size", "50px");
				$("body").append(comboBox2);

				var checkbox1 = document.createElement("input");
				$(checkbox1).attr("type", "checkbox");
				$(checkbox1).css("margin", "2px");
				var checkbox2 = document.createElement("input");
				$(checkbox2).attr("type", "checkbox");
				$(checkbox2).css("margin", "2px");
                $(checkbox2).attr("checked", "checked");

				comboBox2.addOption("Australia", checkbox1);
				comboBox2.addOption("Belgium", null, true, false);
				comboBox2.addOption("Canada", checkbox2);
				comboBox2.addOption("Germany", checkbox1);
				comboBox2.addOption("Ireland", checkbox1);
				comboBox2.addOption("Netherlands", checkbox2);
				comboBox2.addOption("U.S.A.", checkbox2);
				comboBox2.addOption("United Kingdom", checkbox2);

                $(comboBox2).on("optionselect", function(event) {
                    $(".message").remove();
                    if (!event.selection.selectable) {
                        var text = "Sorry, country " + event.value + " is not selectable";
                        message(event, text);
                    }
                });

                comboBox2.setValue("Netherlands", false);

                function message(selectEvent, text) {
                    var div = document.createElement("div");
                    $(div).attr("class", "message");
                    $(div).width(499);
                    $(div).height(100);
                    $(div).css("display", "none");
                    $(div).css("position", "relative");
                    $(div).css("left", "290px");
                    $(div).css("text-align", "center");
                    $(div).css("border", "10px solid #527FC3");
                    var span = document.createElement("span");
                    $(span).text(text);
                    $(span).css("position", "relative");
                    $(span).css("top", "25%");
                    $(span).css("font-size", "20px");
                    $(span).css("font-weight", "bold");
                    $(div).append(span);
                    var button = document.createElement("button");
                    $(button).text("OK");
                    $(button).css("position", "absolute");
                    $(button).css("right", "8px");
                    $(button).css("bottom", "8px");
                    $(div).append(button);
                    $("body").append(div);
                    $(div).show(1000);
                    $(button).focus();
                    $(button).on("click", function(event) {
                        $(div).hide(1000);
                        $(selectEvent.currentTarget).find(".oyocomboboxinput").focus();
                        event.stopImmediatePropagation();
                    });
                }
            });
		</script>

	</body>
</html>
